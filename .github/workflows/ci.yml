name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  downloader:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: downloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: downloader/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: cross-compile sanity (build-tag split)
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "build $t"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
          done

  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            libsoup-3.0-dev libappindicator3-dev patchelf
      - name: Placeholder bundle inputs (tauri-build validates resources/externalBin exist)
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/resources/web src-tauri/resources/bin src-tauri/binaries
          echo "placeholder" > src-tauri/resources/web/server.js
          echo "placeholder" > src-tauri/resources/bin/.keep
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          : > "src-tauri/binaries/downloader-$triple$ext"
          : > "src-tauri/binaries/node-$triple$ext"
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
