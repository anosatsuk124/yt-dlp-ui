[package]
name = "ytdlp-ui"
version = "0.1.0"
description = "yt-dlp UI — native desktop app"
authors = ["Satsuki Akiba"]
edition = "2021"
rust-version = "1.77"

# The Tauri app logic lives in a library so the same code can target desktop
# (src/main.rs) and, if ever needed, mobile. Desktop-only today.
[lib]
name = "ytdlp_ui_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reverse proxy + SSE event bridge over the sidecar IPC sockets.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

# Release profile tuned for smaller, faster binaries.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
