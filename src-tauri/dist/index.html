<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yt-dlp-ui</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0b0c; color: #e5e7eb;
        font: 14px system-ui, -apple-system, sans-serif; }
      .wrap { height: 100%; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px; }
      .spin { width: 30px; height: 30px; border: 3px solid #2a2a2e;
        border-top-color: #9ca3af; border-radius: 50%; animation: s 0.9s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      .sub { color: #6b7280; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spin"></div>
      <div>Starting yt-dlp-ui…</div>
      <div class="sub">launching local services</div>
    </div>
  </body>
</html>
